<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="50%" stop-color="#292524" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="featherGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="#d97706" stroke-width="3" stroke-opacity="0.35" />

  <!-- Orbiting Timeline Arc -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="14 10" stroke-opacity="0.4" />
  
  <!-- Hourglass / Time ticks -->
  <circle cx="256" cy="86" r="5" fill="#fde68a" />
  <circle cx="426" cy="256" r="4" fill="#f59e0b" />
  <circle cx="256" cy="426" r="5" fill="#fde68a" />
  <circle cx="86" cy="256" r="4" fill="#f59e0b" />

  <!-- Elegant Feather (Pluma) -->
  <g transform="translate(256,256) rotate(-42) translate(-256,-256)" filter="url(#glow)">
    <!-- Feather Stem / Spine -->
    <path d="M 256 90 Q 254 260 210 420" stroke="#fef3c7" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M 210 420 L 200 440" stroke="#fde68a" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Feather Left Vane -->
    <path d="M 256 90 C 210 130 150 200 165 290 C 172 330 195 380 216 410 C 220 370 235 270 255 190 Z" fill="url(#featherGrad)" opacity="0.95" />

    <!-- Feather Right Vane -->
    <path d="M 256 90 C 290 140 350 220 330 310 C 318 355 285 390 230 415 C 242 360 252 270 256 180 Z" fill="url(#goldGrad)" opacity="0.9" />

    <!-- Feather Cuts / Texture -->
    <path d="M 205 230 L 165 250" stroke="#1c1917" stroke-width="3.5" stroke-linecap="round" opacity="0.6" />
    <path d="M 220 290 L 175 320" stroke="#1c1917" stroke-width="3.5" stroke-linecap="round" opacity="0.6" />
    <path d="M 285 240 L 330 260" stroke="#1c1917" stroke-width="3.5" stroke-linecap="round" opacity="0.6" />
    <path d="M 270 310 L 315 335" stroke="#1c1917" stroke-width="3.5" stroke-linecap="round" opacity="0.6" />

    <!-- Quill Nib tip sparkle -->
    <circle cx="200" cy="440" r="3" fill="#ffffff" />
  </g>
</svg>
